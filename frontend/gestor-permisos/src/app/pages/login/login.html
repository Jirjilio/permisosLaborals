<div class="login-page">
        <div class="login-card">
          <div class="login-logo">🏢</div>

          <h2 class="text-center mb-1">Iniciar sessió</h2>
          <p class="text-center text-secondary mb-4">Accedeix al gestor de permisos</p>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="gp-label" for="usuari">Usuari</label>
              <input
                id="usuari"
                type="text"
                class="gp-input"
                formControlName="usuari"
                placeholder="Introdueix l'usuari">
            </div>

            <div class="mb-4">
              <label class="gp-label" for="password">Password</label>
              <input
                id="password"
                type="password"
                class="gp-input"
                formControlName="password"
                placeholder="Introdueix la contrasenya">
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger py-2">
              {{ errorMessage }}
            </div>

            <button type="submit" class="btn-gp-primary w-100" [disabled]="loading">
              {{ loading ? 'Entrant...' : 'Entrar' }}
            </button>
          </form>
        </div>
      </div>
